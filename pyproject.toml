[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "california-housing-model-lab"
version = "1.0.0"
description = "A leakage-aware, spatial holdout benchmark for practical California housing value regression"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/california_housing_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
